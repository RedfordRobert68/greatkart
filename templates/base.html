{% load static %}
<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="cache-control" content="max-age=604800" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>GreatKart | One of the Biggest Online Shopping Platform</title>

<link href="{% static 'images/favicon.ico' %}" rel="shortcut icon" type="image/x-icon">

<!-- jQuery -->
{% comment %} <script src="{% static 'js/jquery-2.0.0.min.js' %}" type="text/javascript"></script> {% endcomment %}

<!-- Bootstrap4 files-->
<script src="{% static 'js/bootstrap.bundle.min.js' %}" type="text/javascript"></script>
<link href="{% static 'css/bootstrap.css' %}" rel="stylesheet" type="text/css"/>

<!-- Font awesome 5 -->
<link href="{% static 'fonts/fontawesome/css/all.min.css' %}" type="text/css" rel="stylesheet">

<!-- custom style -->
<link href="{% static 'css/ui.css' %}" rel="stylesheet" type="text/css"/>
<link href="{% static 'css/responsive.css' %}" rel="stylesheet" media="only screen and (max-width: 1200px)" />
<link href="{% static 'css/custom.css' %}" rel="stylesheet" type="text/css"/>
<!-- CDN version -->
<!-- For Font Awesome 6 Free (Web) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">



<!-- Paypal Styles -->
<!-- <link rel="stylesheet" type="text/css" href="css/cardfields.css" /> -->

<!-- custom javascript -->
<script src="{% static 'js/script.js' %}" type="text/javascript"></script>

<!--Paypal script-->
<script
    src="https://www.paypal.com/sdk/js?client-id=AQeFRi3dWNo4sQRWC7moW1gJ_64zbj9zIcvKAuNB5Q3j4YdxXuVLLG4t-S98yN4qnqfPP55zfER2WVbb&buyer-country=US&currency=USD&components=buttons&disable-funding=venmo,paylater&enable-funding=card"
    data-sdk-integration-source="developer-studio">
</script>

<style>
    
{% comment %} .rate > input {
    display: none;
}

.rate {
    display: inline-block;
    border: 0;
}

.rate > label {
    float: right;
}

/* Showing the stars */

.rate > label:before {
    display: inline-block;
    font-size: 1.1rem;
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    content: "\f005";
    margin: 0;
    padding: 0.3rem .2rem;
    cursor: pointer;
}

.rate .half:before {
    content: "\f089";
    position: absolute;
    padding-right: 0;
} {% endcomment %}

</style>

</head>
<body>

    <!-- navbar -->
    {% include 'includes/navbar.html' %}

    {% block content %}
        <!-- content -->
    {% endblock %}

    <!-- footer -->
    {% include 'includes/footer.html' %}

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            $('.thumb a').click(function(e){
                e.preventDefault();
                $('.mainImage img').attr('src',$(this).attr("href"));
            })
        })
    </script>
</body>
</html>
